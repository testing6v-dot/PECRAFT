  <path d="M600 125 730 200 730 350 600 425 470 350 470 200Z" fill="none" stroke="#b78aff" stroke-opacity=".35" stroke-width="3"/>
  <path d="M515 205h170v45H560v45h105v45H560v55h-45Z" fill="url(#purple)"/>
  <path d="M685 205h-45v190h45v-70h30v-45h-30Z" fill="#f4efff"/>
  <text x="600" y="545" text-anchor="middle" fill="#f7f4ff" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="10">PECRAFT</text>
  <text x="600" y="588" text-anchor="middle" fill="#aa8ae8" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="6">JAVA  •  BEDROCK  •  SURVIVAL</text>
</svg>